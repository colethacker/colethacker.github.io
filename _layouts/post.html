---
layout: default
---
<div class="post-container" id="post-container">

  <!-- 1. The Sidebar -->
  <aside class="post-sidebar" id="post-sidebar">
    <div class="sidebar-content">
      <h4>Contents</h4>
      <nav class="post-toc" id="post-toc"></nav>
    </div>
  </aside>

  <!-- 2. The Toggle Button -->
  <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle Contents">&larr;</button>

  <!-- 3. The Main Post Area -->
  <main class="post-main-content">
    <article class="post">
      <header class="post-header">
        <h1 class="post-title">{{ page.title | escape }}</h1>
        <p class="post-meta">
          {%- assign date_format = site.minima.date_format | default: "%b %-d, %Y" -%}
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: date_format }}</time>
        </p>
      </header>

      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </main>

</div>

<!-- 4. Link to our JavaScript -->
<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
